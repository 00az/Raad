name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    env:
      RAAD_DOMAIN_NAME: api.dev.example.test
      RAAD_HOSTED_ZONE_ID: Z0123456789
      RAAD_CERTIFICATE_ARN: arn:aws:acm:us-east-1:111111111111:certificate/00000000-0000-0000-0000-000000000000
      RAAD_ALERT_EMAIL: build@example.test
      RAAD_COGNITO_DOMAIN_PREFIX: raad-build-example-test
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global aws-cdk
      - run: uv sync --locked --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check raad_platform tests app.py
      - run: uv run mypy .
      - run: uv run pip-audit
      - run: uv run cdk synth --all
      - uses: gitleaks/gitleaks-action@v2
