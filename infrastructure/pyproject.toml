[project]
name = "raad-platform-infrastructure"
version = "0.1.0"
description = "RAAD shared platform infrastructure and edge adapter"
requires-python = ">=3.12,<3.13"
dependencies = ["aws-cdk-lib>=2.180,<3", "constructs>=10.0,<11", "boto3>=1.35,<2", "requests>=2.32,<3", "requests-aws4auth>=1.3,<2", "PyJWT[crypto]>=2.10,<3", "cdk-nag>=2.35,<3"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "hypothesis>=6.120,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "cdk-nag>=2.35,<3",
    "pip-audit>=2.7,<3",
    "boto3-stubs>=1.44.3",
    "types-requests>=2.33.0.20261030",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0.2,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=raad_platform --cov-report=term-missing --cov-fail-under=80"
# The local-DynamoDB boundary runs only by explicit path, with its endpoint set; see
# tests/integration/. It fails rather than skips when that local store is missing.
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", "integration"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["raad_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["raad_platform"]
